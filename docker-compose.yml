version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sccg-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Smart Cloud Cost Guardian
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - SECRET_KEY=sccg-production-jwt-super-secret-key-finops-guard-2026!
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite:///./sccg_production.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AWS_DEFAULT_REGION=us-east-1
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173"]
    volumes:
      - sccg-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sccg-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sccg-data:
